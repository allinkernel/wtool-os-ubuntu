---
# wtool 基础软件包 —— 「让 shell 环境能跑起来」所需的那一批
#
# 迁移自 mytool/os/wsw_install.sh 的包列表，但做了两处改动：
#   1. 按类别拆成多个 task —— 一个大 task 会静默好几分钟，看不见进度
#   2. 重型工具链（clang/llvm/gcc/gdb/emacs + multilib 库）挪到 toolchain.yaml，
#      只在设了 WTOOL_HEAVY=1 时才装（那部分 1GB+）
#
# 用法（由 wtool 引擎调用，不需要你手动跑）：
#   wtool provision os/ubuntu --with-system
- name: wtool 基础软件包
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  # 容器/无人值守环境里必须设，否则 debconf 的交互提问会把 task 挂死
  environment:
    DEBIAN_FRONTEND: noninteractive

  tasks:
    - name: 1/7 基础工具
      ansible.builtin.package:
        state: present
        name:
          - tree
          - apt-file
          - git
          - ranger
          - dos2unix
          - bat
          # wtool publish 优先用它打包（多线程、压缩率比 gzip 好很多）。
          # 没有它也不会出错，但资产名会变成 .tar.gz——引擎按输出扩展名
          # 选压缩器，不会出现"名字叫 zst、内容其实是 gz"这种事。
          - zstd

    - name: 2/7 shell 与终端
      ansible.builtin.package:
        state: present
        name:
          - zsh
          - tmux

    - name: 3/7 编辑器
      ansible.builtin.package:
        state: present
        name:
          - vim
          - neovim

    - name: 4/7 远程与网络工具
      ansible.builtin.package:
        state: present
        name:
          - openssh-server
          - curl
          - wget
          - net-tools

    - name: 5/7 搜索工具
      ansible.builtin.package:
        state: present
        name:
          - ripgrep
          - fd-find
          - silversearcher-ag

    - name: 6/7 构建基础
      ansible.builtin.package:
        state: present
        name:
          - make
          - cmake
          - binutils

    - name: 7/7 杂项与可视化
      ansible.builtin.package:
        state: present
        name:
          - graphviz
          - sl
          - neofetch
